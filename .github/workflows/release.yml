name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - name: Validate tag
        id: version
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Verify source
        run: |
          test -z "$(gofmt -l .)"
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          shellcheck scripts/*.sh packaging/*.sh
      - name: Build reproducible artifacts
        run: |
          scripts/build-release.sh "${{ steps.version.outputs.value }}" dist
          scripts/build-release.sh "${{ steps.version.outputs.value }}" dist-rebuilt
          diff -rq dist dist-rebuilt
      - uses: anchore/sbom-action@v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/homelab-inventory-agent.spdx.json
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign checksum manifest
        run: cosign sign-blob --yes --bundle dist/checksums.sigstore.json dist/checksums.txt
      - uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: 'dist/homelab-inventory-agent-*'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
