name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.7'
          cache: true
      - name: Verify Go toolchain pin
        run: test "$(go env GOVERSION)" = "go$(awk '/^toolchain / { sub(/^go/, "", $2); print $2 }' go.mod)"
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Vulnerability analysis
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Check shell packaging
        run: shellcheck scripts/*.sh packaging/*.sh
      - name: Test Ubuntu installation transaction
        run: scripts/test-ubuntu-install.sh 0.0.0-ci
      - name: Test Alpine OpenRC installation transaction
        run: scripts/test-alpine-install.sh 0.0.0-ci amd64
      - name: Build release artifacts twice
        run: |
          scripts/build-release.sh 0.0.0-ci dist-a
          scripts/build-release.sh 0.0.0-ci dist-b
          diff -rq dist-a dist-b
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: agent-ci-binaries
          path: dist-a/
          if-no-files-found: error

  verify-alpine-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.7'
          cache: true
      - name: Verify Go toolchain pin
        run: test "$(go env GOVERSION)" = "go$(awk '/^toolchain / { sub(/^go/, "", $2); print $2 }' go.mod)"
      - name: Test Alpine OpenRC installation transaction on ARM64
        run: scripts/test-alpine-install.sh 0.0.0-ci arm64
